<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理围栏 & 路线管理</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0c1426; color: #e0e6ed; padding: 12px 16px; display: flex; flex-direction: column; }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }
        h1 { font-size: 1.5em; margin-bottom: 10px; background: linear-gradient(90deg, #00d4ff, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
        .main-layout { display: flex; gap: 12px; flex: 1; min-height: 0; }
        .map-panel { flex: 1; position: relative; min-height: 0; }
        #map { width: 100%; height: 100%; border-radius: 10px; border: 1px solid rgba(0, 212, 255, 0.2); }
        .side-panel { width: 400px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 212, 255, 0.18); border-radius: 10px; padding: 12px; }
        .card h3 { color: #00d4ff; font-size: 0.95em; margin-bottom: 8px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; color: #aab; font-size: 0.82em; margin-bottom: 2px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 5px 8px; border-radius: 5px; border: 1px solid #334; background: #1a2332; color: #e0e6ed; font-size: 0.88em; }
        .form-group textarea { min-height: 44px; resize: vertical; font-family: monospace; font-size: 0.8em; }
        .form-group select { cursor: pointer; }
        .form-row { display: flex; gap: 6px; }
        .form-row .form-group { flex: 1; }
        .btn { padding: 6px 14px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.85em; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0090b0); color: #fff; }
        .btn-primary:hover { filter: brightness(1.2); }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #cc4444); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.06); border: 1px solid #445; color: #aab; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-sm { padding: 3px 8px; font-size: 0.8em; }
        .btn-group { display: flex; gap: 5px; margin-top: 6px; }
        .list-container { max-height: 200px; overflow-y: auto; }
        .item-card { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 5px; background: rgba(255,255,255,0.03); margin-bottom: 3px; cursor: pointer; transition: background 0.2s; }
        .item-card:hover { background: rgba(0,212,255,0.08); }
        .item-card.active { background: rgba(0,212,255,0.12); border: 1px solid rgba(0,212,255,0.3); }
        .item-card .name { font-weight: 500; }
        .badge { font-size: 0.75em; padding: 1px 5px; border-radius: 3px; }
        .badge-on { background: rgba(0,255,136,0.15); color: #00ff88; }
        .badge-off { background: rgba(255,107,107,0.15); color: #ff6b6b; }
        .badge-radius { background: rgba(0,212,255,0.1); color: #00d4ff; }
        .badge-purple { background: rgba(123,44,191,0.2); color: #b37feb; }
        .badge-type { background: rgba(183,127,235,0.2); color: #b37feb; font-size: 0.7em; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
        .status-bar { padding: 8px; border-radius: 6px; font-size: 0.82em; margin-bottom: 6px; }
        .status-info { background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2); }
        .status-error { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); color: #ff6b6b; }
        .coord-display { font-family: monospace; font-size: 0.75em; color: #5a6a7a; margin-top: 3px; }
        .map-tip { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #e0e6ed; padding: 4px 12px; border-radius: 6px; font-size: 0.82em; z-index: 1000; pointer-events: none; white-space: nowrap; }
        .search-bar { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 3px; background: rgba(20,30,48,0.92); padding: 3px 6px; border-radius: 6px; border: 1px solid #445; }
        .search-bar input { padding: 3px 6px; border-radius: 4px; border: none; background: transparent; color: #e0e6ed; font-size: 0.85em; width: 180px; outline: none; }
        .search-bar input::placeholder { color: #5a6a7a; }
        .search-bar button { padding: 3px 6px; font-size: 0.85em; background: transparent; border: none; color: #00d4ff; cursor: pointer; }
        .search-bar button:hover { color: #7b2cbf; }
        .search-results { position: absolute; top: 42px; right: 10px; z-index: 1000; background: rgba(20,30,48,0.96); border: 1px solid #445; border-radius: 5px; max-height: 320px; overflow-y: auto; width: 280px; display: none; }
        .search-results div { padding: 6px 10px; cursor: pointer; font-size: 0.82em; border-bottom: 1px solid rgba(255,255,255,0.05); color: #aab; }
        .search-results div:hover { background: rgba(0,212,255,0.15); color: #e0e6ed; }
        .node-list { max-height: 120px; overflow-y: auto; font-family: monospace; font-size: 0.78em; }
        .node-item { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; border-radius: 3px; margin-bottom: 1px; }
        .node-item:hover { background: rgba(255,107,107,0.1); }
        .node-item .node-del { color: #ff6b6b; cursor: pointer; padding: 0 4px; font-size: 1.1em; line-height: 1; }
        .node-item .node-del:hover { color: #ff4444; }
        .node-idx { color: #5a6a7a; margin-right: 6px; }
        .type-badge { font-size: 0.7em; padding: 1px 6px; border-radius: 4px; background: rgba(0,212,255,0.1); color: #00d4ff; white-space: nowrap; }
        .locate-btn { font-size: 1.1em; line-height: 1; padding: 3px 8px !important; }
        .tab-bar { display: flex; gap: 0; margin-bottom: 10px; flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 1.05em; font-weight: 600; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px 10px 0 0; cursor: pointer; transition: all 0.25s; color: #5a6a7a; border-bottom: 2px solid transparent; }
        .tab-btn:hover { color: #aab; background: rgba(255,255,255,0.05); }
        .tab-btn.active { background: rgba(0,212,255,0.08); color: #00d4ff; border-color: rgba(0,212,255,0.2); border-bottom-color: #00d4ff; }
        .tab-btn.purple-tab.active { background: rgba(123,44,191,0.08); color: #b37feb; border-color: rgba(123,44,191,0.2); border-bottom-color: #b37feb; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .derive-label { font-size: 0.7em; color: #b37feb; font-style: italic; }
        .road-info { font-size: 0.78em; color: #5a6a7a; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 地理围栏 & 路线管理</h1>
        <div class="tab-bar">
            <div class="tab-btn active" id="tabFence" onclick="switchTab('fence')">📍 围栏管理</div>
            <div class="tab-btn purple-tab" id="tabRoad" onclick="switchTab('road')">🛤️ 路线管理</div>
        </div>
        <div class="main-layout">
            <div class="map-panel">
                <div id="map"></div>
                <div class="map-tip" id="mapTip">点击添加节点 · 右键删除节点 · 拖拽移动</div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索地名/POI..." onkeydown="if(event.key==='Enter') searchPlace()">
                    <button onclick="searchPlace()">🔍</button>
                    <button class="locate-btn" onclick="locateMe()" title="定位当前位置">◎</button>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="side-panel">
                <!-- ===== 围栏 Tab ===== -->
                <div class="tab-content active" id="fenceTab">
                    <div class="card">
                        <h3>✏️ 编辑围栏</h3>
                        <div id="formMessage"></div>
                        <div class="form-group">
                            <label>围栏名称</label>
                            <input type="text" id="fenceName" placeholder="如：遵义-仁怀段">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>缓冲半径（米）</label>
                                <input type="number" id="bufferRadius" value="200" min="1" step="1">
                            </div>
                            <div class="form-group" style="flex:0 0 80px;">
                                <label>启用</label>
                                <input type="checkbox" id="isActive" checked style="accent-color:#00d4ff;width:auto;margin-top:6px;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>折线坐标（JSON，点击地图自动生成）</label>
                            <textarea id="polylineCoords" placeholder="[[lng,lat],[lng,lat],...]" readonly></textarea>
                        </div>
                        <div class="form-group">
                            <label>添加坐标（经度,纬度，每行一个）</label>
                            <textarea id="manualCoords" placeholder="106.92,27.73&#10;106.95,27.76" style="min-height:48px;"></textarea>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-secondary btn-sm" onclick="importCoords()">+ 导入坐标</button>
                            <button class="btn btn-secondary btn-sm" onclick="deleteLastNode('fence')">↩ 删除最后节点</button>
                            <button class="btn btn-secondary btn-sm" onclick="clearPoints('fence')">✕ 清空全部</button>
                        </div>
                        <div class="coord-display" id="coordCount">节点数: 0</div>
                        <div class="node-list" id="nodeList"></div>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="saveFence()">💾 保存围栏</button>
                            <button class="btn btn-secondary" onclick="resetFenceEditor()">↩ 重置</button>
                            <button class="btn btn-danger btn-sm" id="fenceDeleteBtn" onclick="deleteFence()" style="display:none">🗑 删除</button>
                        </div>
                    </div>
                    <div class="card">
                        <h3>📋 围栏列表</h3>
                        <div id="fenceList" class="list-container">
                            <div style="color:#5a6a7a;font-size:0.9em;">加载中...</div>
                        </div>
                    </div>
                </div>

                <!-- ===== 路线 Tab ===== -->
                <div class="tab-content" id="roadTab">
                    <div class="card">
                        <h3>✏️ 编辑路线</h3>
                        <div id="roadFormMessage"></div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>路线编号 <span style="color:#ff6b6b;">*</span></label>
                                <input type="text" id="roadCode" placeholder="如：LJ001">
                            </div>
                            <div class="form-group">
                                <label>路线名称 <span style="color:#ff6b6b;">*</span></label>
                                <input type="text" id="roadName" placeholder="如：龙结路">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>路线类型</label>
                                <select id="roadLineType">
                                    <option value="main">主线 (main)</option>
                                    <option value="branch">支线 (branch)</option>
                                    <option value="loop">环线 (loop)</option>
                                    <option value="connector">连接线 (connector)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>桩号前缀</label>
                                <select id="roadPrefix">
                                    <option value="K">K</option>
                                    <option value="PK">PK</option>
                                    <option value="AK">AK</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>桩号偏移 (m)</label>
                                <input type="number" id="roadStationOffset" value="0" min="0" step="1">
                            </div>
                            <div class="form-group">
                                <label>缓冲区 (m)</label>
                                <input type="number" id="roadBufferMeters" value="200" min="0" step="10">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>项目 ID</label>
                            <input type="number" id="roadProjectId" value="" placeholder="可选">
                        </div>
                        <div class="form-group">
                            <label>折线坐标（JSON，点击地图自动生成）</label>
                            <textarea id="roadPolylineCoords" placeholder="[[lng,lat],[lng,lat],...]" readonly></textarea>
                        </div>
                        <div class="form-group">
                            <label>添加坐标（经度,纬度，每行一个）</label>
                            <textarea id="roadManualCoords" placeholder="106.92,27.73&#10;106.95,27.76" style="min-height:48px;"></textarea>
                        </div>
                        <div class="form-group">
                            <label>GeoJSON 文件导入</label>
                            <input type="file" id="geojsonFile" accept=".json,.geojson" style="font-size:0.85em;color:#aab;">
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-secondary btn-sm" onclick="importRoadCoords()">+ 导入坐标</button>
                            <button class="btn btn-secondary btn-sm" onclick="deleteLastNode('road')">↩ 删除最后节点</button>
                            <button class="btn btn-secondary btn-sm" onclick="clearPoints('road')">✕ 清空全部</button>
                        </div>
                        <div class="coord-display" id="roadCoordCount">节点数: 0</div>
                        <div class="node-list" id="roadNodeList"></div>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="saveRoad()" id="roadSaveBtn">💾 创建路线</button>
                            <button class="btn btn-secondary" onclick="resetRoadEditor()">↩ 重置</button>
                            <button class="btn btn-danger btn-sm" id="roadDeleteBtn" onclick="deleteRoad()" style="display:none">🗑 删除</button>
                        </div>
                    </div>
                    <div class="card">
                        <h3>📋 路线列表</h3>
                        <div id="roadList" class="list-container">
                            <div style="color:#5a6a7a;font-size:0.9em;">加载中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function(){
        var token = localStorage.getItem("NOCOBASE_TOKEN") || localStorage.getItem("nocobase_token");
        var headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        var map = L.map('map').setView([27.7, 106.9], 10);
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: ['1','2','3','4'], maxZoom: 18,
            attribution: '&copy; 高德地图'
        }).addTo(map);

        // ---- State ----
        var currentTab = 'fence';
        var fencePoints = [];
        var roadPoints = [];
        var fenceMarkers = [];
        var roadMarkers = [];
        var fencePolyline = null;
        var fenceBuffer = null;
        var roadPolyline = null;
        var roadBuffer = null;
        var selectedFenceId = null;
        var selectedRoadId = null;
        var allFences = [];
        var allRoads = [];
        var allFenceLayers = [];
        var allRoadLayers = [];
        var currentLocationMarker = null;

        // ---- Utilities ----
        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function computeBbox(points) {
            if (!points || points.length === 0) return null;
            var lats = points.map(function(p){ return p[1]; });
            var lngs = points.map(function(p){ return p[0]; });
            return { min_lat: Math.min.apply(null,lats), max_lat: Math.max.apply(null,lats), min_lng: Math.min.apply(null,lngs), max_lng: Math.max.apply(null,lngs) };
        }
        function getPoints(tab) { return tab === 'fence' ? fencePoints : roadPoints; }
        function setPoints(tab, pts) { if(tab==='fence') fencePoints=pts; else roadPoints=pts; }

        function showMessage(msg, type, tab) {
            var elId = tab === 'road' ? 'roadFormMessage' : 'formMessage';
            var el = document.getElementById(elId);
            el.innerHTML = '<div class="status-bar status-' + (type||'info') + '">' + msg + '</div>';
            setTimeout(function(){ el.innerHTML = ''; }, 3000);
        }

        // ---- Tab switching ----
        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabFence').className = tab==='fence' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabRoad').className = tab==='road' ? 'tab-btn purple-tab active' : 'tab-btn purple-tab';
            document.getElementById('fenceTab').className = tab==='fence' ? 'tab-content active' : 'tab-content';
            document.getElementById('roadTab').className = tab==='road' ? 'tab-content active' : 'tab-content';
            clearEditingMarkers(tab === 'fence' ? 'road' : 'fence');
            updateMapTip();
        };

        function updateMapTip() {
            var tip = document.getElementById('mapTip');
            tip.textContent = currentTab === 'fence'
                ? '围栏模式 · 点击添加节点 · 右键删除节点'
                : '路线模式 · 点击添加节点 · 右键删除节点';
        }

        function clearEditingMarkers(otherTab) {
            if (otherTab === 'fence') {
                fenceMarkers.forEach(function(m){ map.removeLayer(m); });
                fenceMarkers = [];
                if (fencePolyline) { map.removeLayer(fencePolyline); fencePolyline = null; }
                if (fenceBuffer) { map.removeLayer(fenceBuffer); fenceBuffer = null; }
            } else {
                roadMarkers.forEach(function(m){ map.removeLayer(m); });
                roadMarkers = [];
                if (roadPolyline) { map.removeLayer(roadPolyline); roadPolyline = null; }
                if (roadBuffer) { map.removeLayer(roadBuffer); roadBuffer = null; }
            }
        }

        // ---- Redraw editing markers for a tab ----
        function redraw(tab) {
            var pts = getPoints(tab);
            var markers = tab === 'fence' ? fenceMarkers : roadMarkers;
            var pl = tab === 'fence' ? fencePolyline : roadPolyline;
            var buf = tab === 'fence' ? fenceBuffer : roadBuffer;
            var color = tab === 'fence' ? '#00d4ff' : '#b37feb';

            if (pl) map.removeLayer(pl);
            if (buf) map.removeLayer(buf);
            markers.forEach(function(m){ map.removeLayer(m); });
            if(tab==='fence') fenceMarkers = []; else roadMarkers = [];
            markers = [];

            var coordsId = tab === 'fence' ? 'polylineCoords' : 'roadPolylineCoords';
            var countId = tab === 'fence' ? 'coordCount' : 'roadCoordCount';
            var nodeId = tab === 'fence' ? 'nodeList' : 'roadNodeList';
            document.getElementById(coordsId).value = JSON.stringify(pts);
            document.getElementById(countId).textContent = '节点数: ' + pts.length;
            renderNodeList(tab);

            if (pts.length === 0) {
                if(tab==='fence') fenceMarkers = markers;
                else roadMarkers = markers;
                return;
            }

            pts.forEach(function(p, i){
                var m = L.circleMarker([p[1], p[0]], {
                    radius: 5, color: color, fillColor: '#7b2cbf', fillOpacity: 1, weight: 2
                }).addTo(map);
                m.bindTooltip(String(i+1), { permanent: true, direction: 'top', offset: [0,-8], className: 'marker-tooltip' });
                m.on('contextmenu', function(){ deleteNode(tab, i); });
                markers.push(m);
            });

            if(tab==='fence') fenceMarkers = markers; else roadMarkers = markers;

            if (pts.length < 2) return;

            var newPl = L.polyline(pts.map(function(p){ return [p[1],p[0]]; }), { color: color, weight: 3 }).addTo(map);
            if(tab==='fence') fencePolyline = newPl; else roadPolyline = newPl;

            try {
                var line = turf.lineString(pts);
                var radiusId = tab === 'fence' ? 'bufferRadius' : 'roadBufferMeters';
                var radius = parseInt(document.getElementById(radiusId).value) || 200;
                var buffered = turf.buffer(line, radius, { units: 'meters' });
                var newBuf = L.geoJSON(buffered, { color: color, weight: 1, fillColor: color, fillOpacity: 0.15 }).addTo(map);
                if(tab==='fence') fenceBuffer = newBuf; else roadBuffer = newBuf;
            } catch(e) {}
        }

        function renderNodeList(tab) {
            var pts = getPoints(tab);
            var containerId = tab === 'fence' ? 'nodeList' : 'roadNodeList';
            var container = document.getElementById(containerId);
            if (pts.length === 0) { container.innerHTML = ''; return; }
            var html = '';
            pts.forEach(function(p, i) {
                html += '<div class="node-item"><span><span class="node-idx">#'+(i+1)+'</span>'+p[0].toFixed(4)+', '+p[1].toFixed(4)+'</span><span class="node-del" onclick="window._deleteNode(\''+tab+'\','+i+')" title="删除节点 #'+(i+1)+'">✕</span></div>';
            });
            container.innerHTML = html;
        }

        function deleteNode(tab, idx) {
            var pts = getPoints(tab);
            if (idx < 0 || idx >= pts.length) return;
            pts.splice(idx, 1);
            redraw(tab);
        }
        window._deleteNode = deleteNode;

        window.deleteLastNode = function(tab) {
            var pts = getPoints(tab);
            if (pts.length === 0) return;
            deleteNode(tab, pts.length - 1);
        };

        window.clearPoints = function(tab) {
            var pts = getPoints(tab);
            if (pts.length === 0) return;
            if (!confirm('清空所有节点？')) return;
            setPoints(tab, []);
            if(tab==='fence') { document.getElementById('polylineCoords').value=''; document.getElementById('manualCoords').value=''; }
            else { document.getElementById('roadPolylineCoords').value=''; document.getElementById('roadManualCoords').value=''; }
            redraw(tab);
        };

        // ---- Map click / right-click ----
        map.on('click', function(e) {
            if (e.originalEvent && e.originalEvent.button === 2) return;
            var pt = [parseFloat(e.latlng.lng.toFixed(6)), parseFloat(e.latlng.lat.toFixed(6))];
            if (currentTab === 'fence') { fencePoints.push(pt); }
            else { roadPoints.push(pt); }
            redraw(currentTab);
        });

        map.on('contextmenu', function(e) {
            var pts = getPoints(currentTab);
            if (pts.length === 0) return;
            var minIdx = -1, minDist = Infinity;
            pts.forEach(function(p, i) {
                var d = map.distance(e.latlng, L.latLng(p[1], p[0]));
                if (d < minDist) { minDist = d; minIdx = i; }
            });
            if (minIdx >= 0 && minDist < 50) deleteNode(currentTab, minIdx);
        });

            document.getElementById('mapTip').textContent =
                (currentTab==='fence'?'围栏':'路线')+'模式 · 坐标: '+e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6);

        // ---- Import coords ----
        function importCoordsFromText(textareaId, tab) {
            var ta = document.getElementById(textareaId);
            var raw = ta.value.trim();
            if (!raw) { showMessage('请先在文本框中输入坐标','error',tab); return; }
            var lines = raw.split('\n');
            var pts = getPoints(tab);
            var added = 0;
            lines.forEach(function(line) {
                line = line.trim();
                if (!line) return;
                var parts = line.split(/[,，\s]+/).filter(Boolean);
                if (parts.length >= 2) {
                    var lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
                    if (!isNaN(lng) && !isNaN(lat)) { pts.push([lng,lat]); added++; }
                }
            });
            if (added === 0) { showMessage('未解析到有效坐标（格式：经度,纬度，每行一个）','error',tab); return; }
            setPoints(tab, pts);
            ta.value = '';
            redraw(tab);
            showMessage('已导入 '+added+' 个节点','info',tab);
        }

        window.importCoords = function() { importCoordsFromText('manualCoords', 'fence'); };
        window.importRoadCoords = function() { importCoordsFromText('roadManualCoords', 'road'); };

        // ---- GeoJSON import ----
        document.getElementById('geojsonFile').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    var geo = JSON.parse(ev.target.result);
                    var coords = null;
                    if (geo.type === 'Feature' && geo.geometry && geo.geometry.type === 'LineString') {
                        coords = geo.geometry.coordinates;
                    } else if (geo.type === 'LineString') {
                        coords = geo.coordinates;
                    }
                    if (!coords || coords.length < 2) { showMessage('GeoJSON 中未找到有效 LineString','error','road'); return; }
                    roadPoints = coords.map(function(c){ return [c[0], c[1]]; });
                    redraw('road');
                    showMessage('从 GeoJSON 导入 '+roadPoints.length+' 个节点','info','road');
                } catch(err) {
                    showMessage('GeoJSON 解析失败: '+err.message,'error','road');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        function renderAllFencesOnMap() {

            allFences.forEach(function(fence) {
                if (!fence.polyline_coords) return;
                try {
                    var coords = JSON.parse(fence.polyline_coords);
                    if (!Array.isArray(coords) || coords.length < 2) return;
                    var isRoadDerived = fence.source === 'road';
                    var latlngs = coords.map(function(p){ return [p[1],p[0]]; });
                    var color = isRoadDerived ? '#b37feb' : (fence.is_active ? '#00d4ff' : '#5a6a7a');
                    var layer = L.polyline(latlngs, { color: color, weight: 2, opacity: 0.5 }).addTo(map);

                    if (isRoadDerived) label += ' <span style="color:#b37feb;font-style:italic;">(路线派生)</span>';
                    layer.bindTooltip(label, { sticky: true });
                    allFenceLayers.push(layer);
                    try {
                        var line = turf.lineString(coords);
                        var buffered = turf.buffer(line, fence.buffer_radius||200, { units:'meters' });
                        var bufLayer = L.geoJSON(buffered, {
                            color: color, weight: 1, fillColor: color, fillOpacity: 0.08
                        }).addTo(map);
                        allFenceLayers.push(bufLayer);
                    } catch(e) {}
                } catch(e) {}

        function getTypeLabel(t) {
            if (!t) return '';
            if (t.startsWith('02')) return '省';
            if (t.startsWith('03')) return '城市';
            if (t.startsWith('04')) return '区县';
            if (t.startsWith('11')) return '景点';
            if (t.startsWith('05')) return '餐饮';
            if (t.startsWith('10')) return '住宿';
            if (t.startsWith('14')) return '科教';
            if (t.startsWith('15')) return '交通';
            if (t.startsWith('13')) return '政府';
            if (t.startsWith('06')) return '购物';
            return 'POI';
        }
        function getZoomForType(t) {
            if (!t) return 14;
            if (t.startsWith('02')) return 7;
            if (t.startsWith('03')) return 9;
            if (t.startsWith('04')) return 12;
            return 15;
        }

        // ============ LOCATE ============
        window.locateMe = async function() {
            if (!map) return;
            showMessage('正在定位...','info','fence');
            function _placeMarker(lat, lng, label) {
                if (currentLocationMarker) map.removeLayer(currentLocationMarker);
                currentLocationMarker = L.circleMarker([lat,lng], {
                    radius: 8, color: '#00d4ff', fillColor: '#00d4ff', fillOpacity: 0.25, weight: 2
                }).addTo(map).bindTooltip(label||'当前位置', { permanent: false });
            }
            try {
                var r = await fetch('/geofence/locate', { headers:headers });
                if (r.ok) {
                    var data = await r.json();
                    if (data.status === '1') {
                        var rect = data.rectangle;
                        var city = data.city;
                        var prov = data.province;
                        if (rect && rect.indexOf(';')>0) {
                            var parts = rect.split(';');
                            if (parts.length===2) {
                                var sw = parts[0].split(','), ne = parts[1].split(',');
                                if (sw.length===2 && ne.length===2) {
                                    map.fitBounds([[parseFloat(sw[1]),parseFloat(sw[0])],[parseFloat(ne[1]),parseFloat(ne[0])]], { padding:[30,30] });
                                    var c = map.getCenter();
                                    _placeMarker(c.lat, c.lng, '当前位置（'+(city||prov||'')+'）');
                                    showMessage('已定位到 '+(city||prov||''),'info','fence');
                                    return;
                                }
                            }
                        }
                        if (city) {
                            var r2 = await fetch('/geofence/geocode?q='+encodeURIComponent(city), { headers:headers });
                            if (r2.ok) {
                                var d2 = await r2.json();
                                if (d2.status==='1'&&d2.tips&&d2.tips.length>0&&d2.tips[0].location) {
                                    var pos = d2.tips[0].location.split(',');
                                    map.setView([parseFloat(pos[1]),parseFloat(pos[0])], 10);
                                    _placeMarker(parseFloat(pos[1]),parseFloat(pos[0]), '当前位置（'+city+'）');
                                    showMessage('已定位到 '+city,'info','fence');
                                    return;
                                }
                            }
                        }
                    }
                }
            } catch(e) {}
            showMessage('正在使用浏览器定位...','info','fence');
            map.locate({ setView: true, maxZoom: 16 });
        };

        map.on('locationfound', function(e) {
            if (currentLocationMarker) map.removeLayer(currentLocationMarker);
            currentLocationMarker = L.circleMarker([e.latitude,e.longitude], {
                radius: 8, color: '#00d4ff', fillColor: '#00d4ff', fillOpacity: 0.25, weight: 2
            }).addTo(map).bindTooltip('当前位置（浏览器定位）', { permanent: false });
            showMessage('已定位（浏览器）','info','fence');
        });
        map.on('locationerror', function(e) {
            showMessage('定位失败: '+e.message,'error','fence');
        });

        // ============ INIT ============
        loadFences();
        loadRoads();
    })();
    </script>
</body>
</html>
